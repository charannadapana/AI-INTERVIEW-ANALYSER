{% extends 'layout.html' %}

{% block content %}
<div class="glass-panel" style="text-align: center; max-width: 450px;">
    <h2 style="margin-top: 0; margin-bottom: 2rem;">Welcome to the Platform</h2>
    
    <div style="display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem;">
        <button class="btn btn-outline" id="candidateBtn" style="flex: 1; margin-right: 0.5rem;" onclick="switchTab('candidate')">Candidate Login</button>
        <button class="btn btn-outline" id="hrBtn" style="flex: 1; margin-left: 0.5rem; opacity: 0.6;" onclick="switchTab('hr')">HR Login</button>
    </div>

    <!-- Candidate Form -->
    <form id="candidateForm" method="POST" action="/login" style="text-align: left;">
        <input type="hidden" name="role" value="candidate">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="John Doe" required>
        
        <label>Email Address</label>
        <input type="email" name="email" placeholder="john@example.com" required>
        
        <label>Interview Topic</label>
        <select name="topic" required style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 2rem;">
            <option style="background:var(--bg-card); color:#fff" value="Web Development">Web Development</option>
            <option style="background:var(--bg-card); color:#fff" value="Machine Learning">Machine Learning</option>
            <option style="background:var(--bg-card); color:#fff" value="Python Programming">Python Programming</option>
            <option style="background:var(--bg-card); color:#fff" value="JavaScript Algorithms">JavaScript Algorithms</option>
        </select>
        
        <button type="submit" class="btn" style="width: 100%;">Start Interview <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
    </form>

    <!-- HR Form -->
    <form id="hrForm" method="POST" action="/login" style="text-align: left; display: none;">
        <input type="hidden" name="role" value="hr">
        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem;">
            Access the HR Dashboard to review candidate interviews, analyze AI-generated insights, and manage evaluations.
        </p>

        <label>Username</label>
        <input type="text" name="username" placeholder="admin" required>
        
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">View Dashboard</button>
    </form>
</div>

<script>
    function switchTab(role) {
        document.getElementById('candidateForm').style.display = role === 'candidate' ? 'block' : 'none';
        document.getElementById('hrForm').style.display = role === 'hr' ? 'block' : 'none';
        
        document.getElementById('candidateBtn').style.opacity = role === 'candidate' ? '1' : '0.6';
        document.getElementById('hrBtn').style.opacity = role === 'hr' ? '1' : '0.6';
    }
</script>
{% endblock %}
